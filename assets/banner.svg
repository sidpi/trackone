<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="ShipTrack — Shipment tracking, simplified">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#12203f"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#818cf8" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="360" fill="url(#bg)"/>
  <circle cx="1120" cy="40" r="260" fill="url(#glowA)"/>
  <circle cx="140" cy="360" r="300" fill="url(#glowB)"/>

  <!-- Logo tile -->
  <g transform="translate(72 114)">
    <rect width="132" height="132" rx="30" fill="#0f172a" stroke="rgba(255,255,255,0.12)"/>
    <g
      fill="none"
      stroke="#ffffff"
      stroke-width="8.4"
      stroke-linecap="round"
      stroke-linejoin="round"
      transform="translate(15.6 15.6) scale(4.2)"
    >
      <path d="M12 10.189V14"/>
      <path d="M12 2v3"/>
      <path d="M19 13V7a2 2 0 0 0-2-2H7a2 2 0 0 0-2 2v6"/>
      <path d="M19.38 20A11.6 11.6 0 0 0 21 14l-8.188-3.639a2 2 0 0 0-1.624 0L3 14a11.6 11.6 0 0 0 2.81 7.76"/>
      <path d="M2 21c.6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1s1.2 1 2.5 1c2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"/>
    </g>
  </g>

  <!-- Wordmark -->
  <text x="248" y="176" fill="#ffffff" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="64" font-weight="700" letter-spacing="-1">ShipTrack</text>
  <text x="250" y="222" fill="#94a3b8" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="26">Shipment tracking, simplified.</text>

  <!-- Feature pills -->
  <g font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#cbd5e1">
    <rect x="250" y="252" width="128" height="40" rx="20" fill="rgba(255,255,255,0.08)"/>
    <text x="314" y="277" text-anchor="middle">Next.js 16</text>

    <rect x="392" y="252" width="118" height="40" rx="20" fill="rgba(255,255,255,0.08)"/>
    <text x="451" y="277" text-anchor="middle">Supabase</text>

    <rect x="524" y="252" width="122" height="40" rx="20" fill="rgba(255,255,255,0.08)"/>
    <text x="585" y="277" text-anchor="middle">Cloudflare</text>

    <rect x="660" y="252" width="104" height="40" rx="20" fill="rgba(255,255,255,0.08)"/>
    <text x="712" y="277" text-anchor="middle">Gmail</text>
  </g>
</svg>
